services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
             docker-entrypoint.sh rabbitmq-server"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_STOMP_PORT}:61613"
      - "${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3 de desarrollo para los adjuntos (hito 7): Adobe S3Mock, que crea el bucket al arrancar y guarda
  # en memoria (se pierde al apagarlo). En producción es S3 de verdad. No valida la firma de las URLs.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${STORAGE_BUCKET:-chat-attachments}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${STORAGE_REGION:-us-east-1}
    ports:
      - "${S3_PORT:-9090}:9090"

  # Cluster de dos instancias (perfil "cluster"): docker compose --profile cluster up --build
  backend-a: &backend
    profiles: ["cluster"]
    build: ./backend
    image: realtime-chat-backend:dev
    environment: &backend-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Límite de mensajes por usuario (ADR 0009). Súbelos para corridas largas del arnés.
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-20}
      RATE_LIMIT_REFILL_PER_MINUTE: ${RATE_LIMIT_REFILL_PER_MINUTE:-30}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000}
      # El worker de notificaciones corre en su propio servicio (más abajo), no en los backends.
      APP_WORKER_ENABLED: "false"
      # S3: el backend entra por el nombre del servicio; el navegador, por el puerto publicado.
      STORAGE_ENDPOINT: http://s3:9090
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9090}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-chat-attachments}
    depends_on:
      s3:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${BACKEND_A_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend-b:
    <<: *backend
    environment: *backend-env
    ports:
      - "${BACKEND_B_PORT:-8082}:8080"

  # El worker de notificaciones (ADR 0013): el mismo jar de los backends, con el consumidor de la
  # cola de menciones encendido y sin publicar la outbox (eso lo hacen los backends). Es un servicio
  # aparte para poder matarlo con SIGKILL (docker compose --profile cluster kill worker) sin tocar
  # a los backends, que es lo que hace el arnés de menciones. No publica ningún puerto.
  worker:
    <<: *backend
    environment:
      <<: *backend-env
      APP_WORKER_ENABLED: "true"
      APP_OUTBOX_PUBLISHER_ENABLED: "false"
    ports: []

  lb:
    profiles: ["cluster"]
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    ports:
      - "${LB_PORT:-8088}:80"

volumes:
  pgdata:
