# Balanceador del cluster: reparte HTTP y WebSocket entre las dos instancias del backend.
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend {
    # Si una instancia cae o se reinicia, el balanceador la salta un instante y usa la otra.
    server backend-a:8080 max_fails=1 fail_timeout=2s;
    server backend-b:8080 max_fails=1 fail_timeout=2s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend;
      proxy_next_upstream error timeout;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Un WebSocket inactivo no debe cortarse a los 60 s.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
