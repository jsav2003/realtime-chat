# Las pruebas envían muchos mensajes desde un mismo usuario: el límite se sube.
# La prueba del rate limit lo baja a 20 con @SpringBootTest(properties = ...).
app.ratelimit.capacity=100000
app.ratelimit.refill-per-minute=100000

# Las esperas de reintento y el ritmo del publicador, en milisegundos: las pruebas del worker no
# pueden esperar los 2 s, 10 s y 1 min de producción.
app.worker.retry-delays=PT0.1S,PT0.2S,PT0.4S
app.outbox.poll-interval=PT0.05S

# Las caídas simuladas del worker hacen fallar al listener a propósito; el aviso de Spring AMQP por
# cada una (con su traza) taparía todo lo demás en el log.
logging.level.org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler=ERROR

# El limpiador de adjuntos huérfanos se maneja a mano desde las pruebas (cleanOnce), sin planificador.
app.storage.cleaner.enabled=false
