spring.application.name=chat

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:chat}
spring.datasource.username=${POSTGRES_USER:chat}
spring.datasource.password=${POSTGRES_PASSWORD:dev-password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
app.jwt.ttl=PT12H

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:chat}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dev-password}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Tiempo real: relay STOMP hacia RabbitMQ y orígenes permitidos para el WebSocket.
app.realtime.relay-host=${RABBITMQ_HOST:localhost}
app.realtime.relay-port=${RABBITMQ_STOMP_PORT:61613}
app.realtime.relay-login=${RABBITMQ_USER:chat}
app.realtime.relay-passcode=${RABBITMQ_PASSWORD:dev-password}
app.realtime.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000}

# Límite de mensajes nuevos por usuario: token bucket en Redis (ADR 0009).
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:20}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:30}

# Presencia: una conexión vive ttl tras su último latido; cada instancia renueva las suyas (ADR 0008).
app.presence.ttl=PT45S
app.presence.refresh-interval=PT15S

# Outbox (ADR 0012): cada poll-interval se llevan a RabbitMQ hasta batch-size eventos pendientes y
# se espera la confirmación del broker. Solo lo confirmado se marca como publicado.
app.outbox.poll-interval=PT0.2S
app.outbox.batch-size=100
app.outbox.confirm-timeout=PT5S
# Se apaga con APP_OUTBOX_PUBLISHER_ENABLED=false (el proceso del worker, en el cluster, no publica).
app.outbox.publisher.enabled=true
# El publicador espera confirmaciones y la presencia renueva en otro hilo del mismo planificador:
# con un solo hilo, un RabbitMQ lento retrasaría el latido de la presencia.
spring.task.scheduling.pool.size=2
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Worker de notificaciones (ADR 0013). Esperas entre reintentos; tras el último fallo, el evento
# va a la cola de mensajes muertos. Se apaga con APP_WORKER_ENABLED=false (los backends del cluster).
app.worker.enabled=true
app.worker.retry-delays=PT2S,PT10S,PT1M
# Cuánto espera el worker a que RabbitMQ confirme el traspaso de un evento a otra cola.
app.worker.confirm-timeout=PT5S

# Adjuntos (hito 7): S3. endpoint es el que usa el backend; public-endpoint es el que se firma en las
# URLs que recibe el navegador (la firma incluye el host). En local, un emulador (Adobe S3Mock).
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9090}
app.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9090}
app.storage.bucket=${STORAGE_BUCKET:chat-attachments}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.access-key=${STORAGE_ACCESS_KEY:dev-access-key}
app.storage.secret-key=${STORAGE_SECRET_KEY:dev-secret-key}
app.storage.upload-ttl=PT5M
app.storage.download-ttl=PT60S
