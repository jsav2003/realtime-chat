spring.application.name=chat

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5435}/${POSTGRES_DB:chat}
spring.datasource.username=${POSTGRES_USER:chat}
spring.datasource.password=${POSTGRES_PASSWORD:dev-password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
app.jwt.ttl=PT12H

spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:chat}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dev-password}

spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6379}
